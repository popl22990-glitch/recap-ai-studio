<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recap AI Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#070a10;--panel:#101622;--panel2:#151d2b;--line:#27354a;--text:#f6f8fc;--muted:#93a1b5;--a:#6d8cff;--b:#9f6cff;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#1a2a55 0,#070a10 62%);color:var(--text);font-family:Inter,system-ui,"Noto Sans Myanmar",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{height:68px;border-bottom:1px solid var(--line);background:#080c14cc;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-weight:900;letter-spacing:-.5px}.brand span{background:linear-gradient(90deg,#7aa2ff,#c084fc);-webkit-background-clip:text;color:transparent}.topnav{display:flex;gap:8px}.nav{border:1px solid transparent;background:transparent;color:#aebbd0;padding:9px 12px;border-radius:10px}.nav.active,.nav:hover{background:#121b2b;border-color:#2c3d56;color:#fff}.shell{max-width:1280px;margin:auto;padding:28px 18px 70px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:stretch}.heroCard,.card{background:linear-gradient(145deg,#111927,#0d131d);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0006}.heroCard{padding:30px}.eyebrow{color:#87a8ff;font-size:12px;font-weight:800;letter-spacing:1.2px}.hero h1{font-size:clamp(34px,5vw,64px);line-height:1.02;margin:10px 0 14px}.hero p{color:var(--muted);line-height:1.8;max-width:700px}.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.primary{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;box-shadow:0 10px 30px #6d8cff33}.ghost{border:1px solid #33445e;background:#121a27;color:#fff;padding:11px 16px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:18px;border-radius:16px;background:#0d141f;border:1px solid #26344a}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.section{margin-top:22px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.sectionTitle h2{margin:0;font-size:20px}.sectionTitle span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{padding:18px}.feature .ico{font-size:26px}.feature h3{margin:12px 0 6px}.feature p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}.dashboard{display:grid;grid-template-columns:230px 1fr;gap:16px}.side{padding:12px;position:sticky;top:84px;height:max-content}.side button{width:100%;text-align:left;margin:3px 0}.side button.active{background:#18243a;border-color:#334b6c}.content{min-width:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:16px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:8px}.panel{padding:20px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid #223047;text-align:left;font-size:13px}.table th{color:#9eacc0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#172238;border:1px solid #2e4262;font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.drop{border:1px dashed #415678;border-radius:18px;padding:30px;text-align:center;background:#0c131e}.drop input{display:none}.drop label{display:inline-block;padding:11px 16px;border-radius:11px;background:#172338;border:1px solid #344b6d;cursor:pointer}.file{margin-top:12px;color:#c5d0df;font-size:13px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;background:#0a111b;border:1px solid #2a3a52;color:#fff;padding:11px 12px;border-radius:10px;outline:none}.form input:focus,.form textarea:focus{border-color:#6287d9}.planGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plan{padding:18px}.plan h3{margin:0 0 7px}.price{font-size:30px;font-weight:900}.plan p{color:var(--muted);font-size:13px;min-height:40px}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:12px;background:#111b2b;border:1px solid #344967;box-shadow:0 15px 40px #0008;z-index:50}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:40}.modalBox{width:min(520px,100%);padding:22px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginBox{width:min(460px,100%);padding:28px}.muted{color:var(--muted)}.danger{border-color:#673342!important;color:#ff9aaa!important}.progress{height:9px;background:#182234;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}.steps{display:grid;gap:9px;margin-top:16px}.step{padding:12px;border:1px solid #25354b;border-radius:12px;background:#0d141f}.step.done{border-color:#275b4b}.footer{text-align:center;color:#65748a;padding:30px 0;font-size:12px}@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.planGrid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.dashboard{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side button{white-space:nowrap;width:auto}.topnav{display:none}}@media(max-width:600px){.grid,.planGrid,.cards{grid-template-columns:1fr}.top{padding:0 14px}.shell{padding:18px 12px 50px}.heroCard{padding:22px}.hero h1{font-size:39px}}
</style></head><body><div id="app"></div><script>
const KEY='recap_ai_config';const saved=JSON.parse(localStorage.getItem(KEY)||'{}');let sb=null,user=null,profile=null,view='home',projects=[],plans=[{name:'Starter',credits:100,price:5},{name:'Creator',credits:500,price:18},{name:'Pro',credits:1500,price:45},{name:'Studio',credits:5000,price:120}];
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function saveConfig(){localStorage.setItem(KEY,JSON.stringify(saved))}function init(){if(saved.url&&saved.key)sb=supabase.createClient(saved.url,saved.key);render()}async function boot(){if(!sb)return;const {data}=await sb.auth.getSession();user=data.session?.user||null;if(user){await loadProfile();await loadProjects()}render()}async function loadProfile(){const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data||null}async function loadProjects(){const r=await sb.from('projects').select('*').order('created_at',{ascending:false}).limit(20);projects=r.data||[]}
function nav(){return `<header class="top"><div class="brand">✦ <span>Recap AI Studio</span></div><div class="topnav"><button class="nav ${view==='home'?'active':''}" onclick="go('home')">Home</button>${user?`<button class="nav ${view==='studio'?'active':''}" onclick="go('studio')">Studio</button><button class="nav ${view==='projects'?'active':''}" onclick="go('projects')">Projects</button>${profile?.role==='admin'?`<button class="nav ${view==='admin'?'active':''}" onclick="go('admin')">Admin</button>`:''}<button class="nav" onclick="logout()">Logout</button>`:`<button class="nav" onclick="showAuth('login')">Login</button>`}</div></header>`}
function home(){return `<main class="shell"><section class="hero"><div class="heroCard"><div class="eyebrow">AI VIDEO RECAP • ONE CLICK WORKFLOW</div><h1>Turn long videos into<br><span style="background:linear-gradient(90deg,#7ea3ff,#c084fc);-webkit-background-clip:text;color:transparent">short, clear stories.</span></h1><p>Upload a video, choose language and voice, then run the full pipeline: transcription → recap → translation → voice → subtitles → render. Built for a simple GitHub + Vercel workflow.</p><div class="cta"><button class="primary" onclick="${user?'go(\'studio\')':'showAuth(\'signup\')'}">⚡ Start One-Click Recap</button><button class="ghost" onclick="go('pricing')">View Credit Plans</button></div></div><div class="heroCard"><div class="stats"><div class="stat"><b>1-Click</b><span>Full recap pipeline</span></div><div class="stat"><b>9:16</b><span>Short-video ready</span></div><div class="stat"><b>MY / EN</b><span>Target language</span></div><div class="stat"><b>Free-first</b><span>Supabase + Vercel</span></div></div><div style="margin-top:14px;padding:15px;border:1px solid #27364c;border-radius:15px;background:#0b121c"><b>Pipeline</b><div class="steps"><div class="step done">✓ 01 Video upload</div><div class="step">02 Transcription</div><div class="step">03 AI recap</div><div class="step">04 TTS + SRT</div><div class="step">05 Video render</div></div></div></div></section><section class="section"><div class="sectionTitle"><h2>Built for speed</h2><span>No complicated editor required</span></div><div class="grid">${[['🎬','Video Intake','Upload your source once and keep project files organized.'],['🧠','AI Recap','Generate a structured recap with configurable language and length.'],['🔊','Voice + SRT','Prepare narration and timed subtitle outputs.'],['⚡','One Click','A single workflow button moves the project through every stage.'],['📊','Credits','Track usage and deduct credits only when a processing job starts.'],['🛡️','Secure Keys','Provider secrets stay server-side; never expose them in the browser.']].map(x=>`<div class="card feature"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></section><section class="section" id="pricing">${pricing()}</section><div class="footer">Recap AI Studio • Free-first architecture • GitHub + Vercel</div></main>`}
function pricing(){return `<div class="sectionTitle"><h2>Credit Plans</h2><span>Admin can edit plans later</span></div><div class="planGrid">${plans.map(p=>`<div class="card plan"><h3>${p.name}</h3><div class="price">$${p.price}</div><p>${p.credits.toLocaleString()} credits</p><button class="primary" style="width:100%" onclick="${user?`requestPlan('${p.name}',${p.credits},${p.price})`:`showAuth('login')`}">Choose Plan</button></div>`).join('')}</div>`}
function dash(){return `<main class="shell"><div class="dashboard"><aside class="card side"><button class="ghost ${view==='studio'?'active':''}" onclick="go('studio')">⚡ New Recap</button><button class="ghost ${view==='projects'?'active':''}" onclick="go('projects')">📁 Projects</button><button class="ghost ${view==='pricing'?'active':''}" onclick="go('pricing')">💳 Credits</button>${profile?.role==='admin'?`<button class="ghost ${view==='admin'?'active':''}" onclick="go('admin')">🛠️ Admin</button>`:''}</aside><section class="content">${view==='studio'?studio():view==='projects'?projectPage():view==='pricing'?pricing():view==='admin'?admin():home()}</section></div></main>`}
function studio(){return `<div class="card panel"><div class="sectionTitle"><div><h2>One-Click Recap Studio</h2><span>Upload → AI → Voice → SRT → Render</span></div><span class="badge">${profile?.credits??0} credits</span></div><div class="drop"><input id="video" type="file" accept="video/*"><label for="video">＋ Choose Video</label><div class="file" id="fileName">No file selected</div></div><div class="form" style="margin-top:14px"><div class="grid" style="grid-template-columns:1fr 1fr"><select id="lang"><option value="my">Myanmar</option><option value="en">English</option></select><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><textarea id="instruction" rows="4" placeholder="Optional: Tell AI what style you want… e.g. dramatic Myanmar movie recap, 60–90 seconds."></textarea><button class="primary" onclick="runPipeline()">⚡ Run Full Pipeline</button></div><div id="runner" class="hidden" style="margin-top:20px"><div class="progress"><i id="bar"></i></div><div id="runText" class="muted" style="margin-top:9px">Preparing…</div><div id="runSteps" class="steps"></div></div></div>`}
function projectPage(){return `<div class="card panel"><div class="sectionTitle"><h2>Project History</h2><button class="ghost" onclick="loadProjects().then(render)">Refresh</button></div><table class="table"><thead><tr><th>Project</th><th>Status</th><th>Created</th><th>Credits</th></tr></thead><tbody>${projects.map(p=>`<tr><td>${esc(p.title)}</td><td><span class="badge">${esc(p.status)}</span></td><td>${new Date(p.created_at).toLocaleString()}</td><td>${p.credits_used??0}</td></tr>`).join('')||`<tr><td colspan="4" class="muted">No projects yet.</td></tr>`}</tbody></table></div>`}
function admin(){return `<div class="cards"><div class="card metric"><small>Total users</small><strong id="mUsers">—</strong></div><div class="card metric"><small>Projects</small><strong id="mProjects">${projects.length}</strong></div><div class="card metric"><small>Your role</small><strong>Admin</strong></div><div class="card metric"><small>Storage</small><strong>Supabase</strong></div></div><div class="card panel" style="margin-top:14px"><h2>Admin Tools</h2><p class="muted">Create/manage users and approve credit requests from Supabase tables. The production-safe implementation keeps service credentials out of the browser.</p><div class="cta"><button class="ghost" onclick="loadAdminUsers()">Load Users</button><button class="ghost" onclick="loadRequests()">Credit Requests</button></div><div id="adminOut" style="margin-top:15px"></div></div>`}
function auth(mode){return `<div class="login"><div class="card loginBox"><div class="eyebrow">RECAP AI STUDIO</div><h1 style="margin:9px 0 20px">${mode==='login'?'Welcome back':'Create account'}</h1><div class="form"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="${mode==='login'?'login()':'signup()'}">${mode==='login'?'Login':'Create account'}</button><button class="ghost" onclick="hideAuth()">Cancel</button></div><p class="muted" style="margin-bottom:0">${mode==='login'?`New here? <a href="#" onclick="showAuth('signup')">Create account</a>`:`Already registered? <a href="#" onclick="showAuth('login')">Login</a>`}</p></div></div>`}
function render(){const base=user?nav()+dash():nav()+home();$('#app').innerHTML=base;const v=$('#video');if(v)v.onchange=()=>$('#fileName').textContent=v.files[0]?.name||'No file selected'}function go(v){view=v;render();if(v==='pricing')scrollTo(0,document.body.scrollHeight)}function showAuth(m){const x=document.createElement('div');x.id='auth';x.innerHTML=auth(m);document.body.appendChild(x)}function hideAuth(){$('#auth')?.remove()}async function login(){if(!sb)return toast('Set Supabase URL + anon key first.');const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)return toast(error.message);hideAuth();await boot()}async function signup(){if(!sb)return toast('Set Supabase URL + anon key first.');const {error}=await sb.auth.signUp({email:$('#email').value,password:$('#pass').value});if(error)return toast(error.message);toast('Account created. Check email if confirmation is enabled.');hideAuth()}async function logout(){await sb?.auth.signOut();user=null;profile=null;projects=[];render()}
async function requestPlan(name,credits,price){if(!sb)return toast('Connect Supabase first.');const {error}=await sb.from('credit_requests').insert({user_id:user.id,plan_name:name,credits,price,status:'pending'});toast(error?error.message:'Plan request submitted to admin.');}
async function runPipeline(){const f=$('#video')?.files[0];if(!f)return toast('Choose a video first.');if(!user)return toast('Login required.');const cost=25;if((profile?.credits??0)<cost)return toast(`Need at least ${cost} credits.`);const title=f.name.replace(/\.[^.]+$/,'');const ins=$('#instruction').value;const lang=$('#lang').value;const ratio=$('#ratio').value;const r=await sb.from('projects').insert({user_id:user.id,title,status:'queued',credits_used:0,source_name:f.name,target_language:lang,output_ratio:ratio,instruction:ins}).select().single();if(r.error)return toast(r.error.message);const project=r.data;$('#runner').classList.remove('hidden');const stages=[['Uploading video',12],['Transcribing speech',32],['Generating AI recap',52],['Generating voice + SRT',72],['Rendering video',90],['Finalizing project',100]];for(const [name,p] of stages){$('#bar').style.width=p+'%';$('#runText').textContent=name+'…';await new Promise(res=>setTimeout(res,650));}const up=await sb.storage.from('videos').upload(`${user.id}/${project.id}-${f.name}`,f,{upsert:true,contentType:f.type});if(up.error){await sb.from('projects').update({status:'storage_error'}).eq('id',project.id);return toast('Upload failed: '+up.error.message)}await sb.from('projects').update({status:'completed',credits_used:cost,source_path:up.data.path}).eq('id',project.id);await sb.rpc('spend_credits',{p_user_id:user.id,p_amount:cost,p_reason:'One-click recap',p_project_id:project.id});await loadProfile();await loadProjects();$('#runText').textContent='Complete ✓';toast('Project completed. Connect AI provider/render worker for real processing.');}
async function loadAdminUsers(){if(!sb)return;const r=await sb.from('profiles').select('id,email,role,credits,created_at').order('created_at',{ascending:false});$('#adminOut').innerHTML=`<table class="table"><tr><th>Email</th><th>Role</th><th>Credits</th><th>Created</th></tr>${(r.data||[]).map(u=>`<tr><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.credits}</td><td>${new Date(u.created_at).toLocaleString()}</td></tr>`).join('')}</table>`}async function loadRequests(){if(!sb)return;const r=await sb.from('credit_requests').select('*').order('created_at',{ascending:false});$('#adminOut').innerHTML=`<table class="table"><tr><th>Plan</th><th>Credits</th><th>Price</th><th>Status</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.plan_name)}</td><td>${x.credits}</td><td>$${x.price}</td><td>${x.status}</td><td>${x.status==='pending'?`<button class="ghost" onclick="approve('${x.id}',${x.credits},'${x.user_id}')">Approve</button>`:'—'}</td></tr>`).join('')}</table>`}async function approve(id,c,u){const r=await sb.rpc('approve_credit_request',{p_request_id:id,p_user_id:u,p_amount:c});toast(r.error?r.error.message:'Approved');loadRequests()}
function setup(){if(saved.url&&saved.key)return boot();document.body.innerHTML=`<div class="login"><div class="card loginBox"><div class="eyebrow">FIRST-TIME SETUP</div><h1>Connect Supabase</h1><p class="muted">Paste your Supabase Project URL and anon key. These are safe to use in the browser; never paste the service-role key.</p><div class="form"><input id="surl" placeholder="https://xxxx.supabase.co"><input id="skey" placeholder="Supabase anon/public key"><button class="primary" onclick="saveSetup()">Connect & Open Studio</button></div><p class="muted">You can edit these later in browser local storage.</p></div></div>`}function saveSetup(){saved.url=$('#surl').value.trim();saved.key=$('#skey').value.trim();if(!saved.url||!saved.key)return toast('Both fields are required.');saveConfig();location.reload()}if(!saved.url||!saved.key)setup();else init();
</script></body></html>
